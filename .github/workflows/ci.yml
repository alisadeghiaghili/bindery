name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        # 3.13 is claimed by classifiers; matrix proves it.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      # Coverage gate (fail_under=90) excludes gui.py — see pyproject.toml.
      # GUI smoke module importorskips tkinter so uv Linux images without
      # Tcl/Tk do not fail collection.
      - name: Pytest
        run: uv run pytest --cov=bindery --cov-report=term-missing

      - name: Documentation audit
        run: uv run python tools/doc_audit.py --path src/bindery --style google --require-example
